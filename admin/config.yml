backend:
  name: turbo-github
  turbo_site_id: 1a82350f-649e-4945-bbfd-c8e92aea0cc9

media_folder: "images"
public_folder: "/images"

collections:
  - name: "notices"
    label: "বিদ্যালয়ের নোটিশ"
    folder: "notices"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "নোটিশের শিরোনাম"
        name: "title"
        widget: "string"
      - label: "তারিখ"
        name: "date"
        widget: "datetime"
      - label: "বিস্তারিত"
        name: "body"
        widget: "markdown"
