
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বিদ্যালয়ের নোটিশ</title>
<style>
body {
  margin: 0;
  font-family: "Noto Sans Bengali", sans-serif;
  background: #f3f6fa;
  color: #222;
}
header {
  background: #087443;
  color: white;
  text-align: center;
  padding: 28px 12px;
}
header h1 { margin: 0; font-size: 28px; }
main {
  max-width: 850px;
  margin: 25px auto;
  padding: 0 15px;
}
.notice {
  background: white;
  padding: 20px;
  margin-bottom: 16px;
  border-radius: 10px;
  border-left: 5px solid #087443;
  box-shadow: 0 2px 8px #0001;
}
.notice h2 { color: #087443; margin-top: 0; }
.date { color: #777; font-size: 14px; }
.notice p { line-height: 1.9; }
footer {
  text-align: center;
  padding: 20px;
  color: #666;
}
</style>
</head>
<body>

<header>
  <img src="logo.png" alt="বিদ্যালয়ের লোগো" style="width:120px; height:120px; object-fit:contain;">
  <h1>৮ নং বেহাকৈর সরকারি প্রাথমিক বিদ্যালয়</h1>
  <p>কাঁচপুর, সোনারগাঁ, নারায়ণগঞ্জ</p>
  <p>প্রতিষ্ঠিত: ১৯৪২ সাল</p>
  <h2>বিদ্যালয়ের নোটিশ বোর্ড</h2>
  <p>সকল বিজ্ঞপ্তি ও গুরুত্বপূর্ণ ঘোষণা</p>
</header>

<main>
  <h2>সর্বশেষ নোটিশ</h2>
  <div id="notices">নোটিশ লোড হচ্ছে...</div>
</main>

<footer>© বিদ্যালয়ের ওয়েবসাইট</footer>

<script>
const repo = "behakoir-primary-school/behakoir-primary-school.github.io";

function escapeHTML(text) {
  return text.replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

function markdown(text) {
  return escapeHTML(text)
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.*?)\*/g, "<em>$1</em>")
    .replace(/\n/g, "<br>");
}

async function loadNotices() {
  const area = document.getElementById("notices");

  try {
    const response = await fetch(
      `https://api.github.com/repos/${repo}/contents/notices`,
      { cache: "no-store" }
    );

    if (!response.ok) throw new Error("নোটিশ পাওয়া যায়নি");

    const files = await response.json();
    const mdFiles = files.filter(f => f.name.endsWith(".md"));

    const notices = await Promise.all(
      mdFiles.map(async file => {
        const res = await fetch(file.download_url);
        const content = await res.text();

        const match = content.match(/^---\s*([\s\S]*?)\s*---\s*/);
        if (!match) return null;

        const front = match[1];
        const title = front.match(/^title:\s*(.*)$/m)?.[1] || file.name;
        const date = front.match(/^date:\s*(.*)$/m)?.[1] || "";
        const body = content.slice(match[0].length).trim();

        return { title, date, body };
      })
    );

    const valid = notices.filter(Boolean).sort(
      (a, b) => new Date(b.date) - new Date(a.date)
    );

    if (!valid.length) {
      area.textContent = "এখনো কোনো নোটিশ প্রকাশিত হয়নি।";
      return;
    }

    area.innerHTML = valid.map(n => `
      <article class="notice">
        <h2>${escapeHTML(n.title)}</h2>
        <div class="date">${escapeHTML(n.date)}</div>
        <p>${markdown(n.body)}</p>
      </article>
    `).join("");

  } catch (error) {
    area.textContent =
      "নোটিশ লোড করা যায়নি। কিছুক্ষণ পর আবার চেষ্টা করুন।";
  }
}

loadNotices();
</script>
</body>
</html>
